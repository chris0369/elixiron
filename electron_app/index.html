<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Electron Elixir WebSocket Test</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
    .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1, h2 { color: #333; }
    .controls button { margin: 5px; padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
    .controls button:hover { background-color: #0056b3; }
    .status-indicator { margin-top: 10px; padding: 10px; border-radius: 4px; }
    .status-connected { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-disconnected { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status-error { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .messages, .file-list-container { margin-top: 20px; }
    #messageList, #fileList { list-style-type: none; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 4px; background-color: #f9f9f9;}
    #messageList li, #fileList li { padding: 8px; border-bottom: 1px solid #eee; }
    #messageList li:last-child, #fileList li:last-child { border-bottom: none; }
    #messageList .client-msg { color: blue; }
    #messageList .server-msg { color: green; }
    #messageList .error-msg { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Electron & Elixir WebSocket Communication</h1>
    <div class="status-indicator" id="statusIndicator">Not Connected</div>
    
    <div class="controls">
      <button id="connectWs">Connect WebSocket</button>
      <button id="disconnectWs">Disconnect WebSocket</button>
      <button id="sendMessage">Send Test JSON Message</button>
      <button id="refreshFileList">Refresh File List</button>
    </div>

    <div class="messages">
      <h2>Messages:</h2>
      <ul id="messageList"></ul>
    </div>

    <div class="file-list-container">
      <h2>Server Files (SFTP Base Path):</h2>
      <ul id="fileList"></ul>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
